server {
  listen 80;
  listen [::]:80;

  root /usr/share/nginx/html;

  # Webpack names build assets with a content hash, so they never change for a
  # given name and can be cached for a long time.
  location ~* "\.[0-9a-f]{8,}\.(?:js|css|map)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Everything else, index.html in particular, is revalidated on every load:
  # without this browsers cached index.html heuristically and kept serving an
  # old bundle for weeks after a deploy.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}

# Connection Type Step
connectionType:
  title: "How are you connected?"
  subtitle: "Choose how you are connected to the internet."
  options:
    wired: "Wired"
    wifi: "WiFi"
    cellular: "Cellular"

# Connection Placement Step
connectionPlacement:
  title: "Where do you have Internet?"
  subtitle: "Choose the option that best applies."
  options:
    home: "Home"
    work: "Work"
    other: "Other"
    none: "I don't have"
  noInternet:
    title: "Confirm you don't have internet"
    subtitle: "Are you sure you don't have an Internet connection at your current location?"
    button: "I don't have internet"

# Connection Cost Step
connectionCost:
  title: "What's your estimated monthly bill cost?"
  subtitle: "This helps us understand the average internet cost in your area."
  currency: "US $"

# Expected Speeds Step
expectedSpeeds:
  title: "Do you know your expected {{type}} speed?"
  subtitle: "Tell us your expected {{type}} speed if you're aware of it."
  button: "I don't know my expected speed"
  input:
    download: "download"
    upload: "upload"
    downloadLabel: "Download speed"
    uploadLabel: "Upload speed"
    placeholder: "E.g. 20"

# Speed Test Step
speedTest:
  ready:
    title: "You're ready to start."
    subtitle: "For more accurate results, please make sure you are not currently making heavy use of your internet connection."
    button: "Start Speed Test"
  running:
    status: "Testing <strong>{{runningTestType}}</strong> speed..."
  connection:
    location: "You are connected at {{networkLocation}}."
    type: "You are connected via {{networkType}}."
  warning: "Please note that the speed test will be counted against your current data plan which may have a data cap."

# Test Results Step
testResults:
  title: "Your test results"
  buttons:
    testAgain: "Test again"
    exploreMap: "Explore the map"
  metrics:
    download: "Download"
    upload: "Upload"
    loss: "Loss"
    latency: "Latency"
  contactInfo:
    title: "Join our effort today"
    subtitle: "Help us study broadband in your region."
    button: "Submit details"
    email:
      label: "Your email address"
      placeholder: "your@email.com"
    phone:
      label: "Your phone number"
      placeholder: "+1 (000) 000-0000"
    firstName:
      label: "Your first name"
      placeholder: "Enter your first name"
    lastName:
      label: "Your last name"
      placeholder: "Enter your last name"

# No Internet Step
noInternet:
  title: "Thanks for letting us know."
  message:
    line1: "While we cannot run a speed test at your location as you don't have Internet, we do appreciate your information that helps us learn more about which areas are currently not served."
    line2: "You can explore the map to see how others compare to you."
  button: "Explore the map"
  modal:
    title: "No Internet connection"
    subtitle: "Please make sure your device is connected to the Internet before continuing."
    button: "Continue anyways"

# Overview Page
overview:
  hero:
    title: "Test and compare your internet speed to others in your area."
    subtitle: "Radar lets you run speed tests on your computer or mobile phone and compare your results to others in your community or in the country."
    buttons:
      test: "Test your speed"
      explore: "Explore the map"
  data:
    title: "We collect thousands of speed test results to understand how broadband varies across the country."
    features:
      explore:
        title: "Explore real data"
        description: "We use real data from speed tests to provide insight into broadband performance nationwide."
      map:
        title: "See results on the map"
        description: "Explore your area on the map and see how broadband varies across different regions."
      identify:
        title: "Identify broadband needs"
        description: "Our data-driven approach helps communities pinpoint where broadband is most needed."
  mobile:
    intro: "Radar for Mobile"
    title: "Test your wifi and cellular connections with our mobile app."
    description: "Radar lets you run speed tests outdoors and indoors, compare results over time, and compare your results with your neighborhood to get a better idea of how broadband looks like around you."


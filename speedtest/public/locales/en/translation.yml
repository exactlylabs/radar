      title: "Test your connectivity"
      description: "Get detailed information about your internet connection."
    track:
      title: "Keep track of your results"
      description: "Check your history to see how your connectivity does over time."
    compare:
      title: "Compare your results"
      description: "Explore the map to see how broadband varies in your region."


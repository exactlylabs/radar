# Overview Page
overview:
  hero:
    title: "Prueba y compara tu velocidad de Internet con otros en tu área."
    subtitle: "Radar te permite realizar tests de velocidad en tu ordenador o teléfono móvil y comparar tus resultados con otros en tu comunidad o en el país."
    buttons:
      test: "Prueba tu velocidad"
      explore: "Explorar el mapa"
  data:
    title: "Recopilamos miles de resultados de tests de velocidad para entender cómo varía la banda ancha en todo el país."
    features:
      explore:
        title: "Explora datos reales"
        description: "Utilizamos datos reales de tests de velocidad para proporcionar información sobre el rendimiento de la banda ancha en todo el país."
      map:
        title: "Ver resultados en el mapa"
        description: "Explora tu área en el mapa y observa cómo varía la banda ancha en diferentes regiones."
      identify:
        title: "Identificar necesidades de banda ancha"
        description: "Nuestro enfoque basado en datos ayuda a las comunidades a identificar dónde se necesita más banda ancha."
  mobile:
    intro: "Radar para Móviles"
    title: "Prueba tus conexiones wifi y móvil con nuestra aplicación móvil."
    description: "Radar te permite realizar tests de velocidad en exteriores e interiores, comparar resultados a lo largo del tiempo, y comparar tus resultados con tu vecindario para tener una mejor idea de cómo es la banda ancha a tu alrededor."


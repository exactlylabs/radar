receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 60s


exporters:
  prometheus:
    endpoint: "0.0.0.0:9464"
    send_timestamps: true
    namespace: "services"

service:
  pipelines:
    metrics/otlp:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus]
